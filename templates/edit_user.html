<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuario</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/styles.css" rel="stylesheet">
    <style>
        .title-bar { background-color: #343a40; color: white; text-align: center; padding: 7px; font-size: 1rem; width: 100%; }
        .title-bar-company { display: flex; justify-content: space-between; align-items: center; background-color: #1d7c3a; color: white; padding: 5px 20px; }
        .title-bar-company img { height: 40px; }
    </style>
</head>
<body>
    <div class="title-bar-company">
        <a href="{{ url_for('index') }}"><img src="/static/images/logo.png" alt="Logo"></a>
        <div class="button-container">
            {% if current_user.is_authenticated %}
                <a href="{{ url_for('logout') }}" class="btn btn-light btn-sm label-principal">Cerrar sesión</a>
            {% endif %}
        </div>
    </div>

    <div class="title-bar">EDITAR USUARIOS</div>

    <div class="container mt-5">
        <div class="alert-container">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="alert alert_mod alert-{{ messages[0][0] }}">{{ messages[0][1] }}</div>
                {% endif %}
            {% endwith %}
        </div>

        <form method="POST" action="{{ url_for('edit_user', user_id=user.id) }}" class="mb-5">
          <div class="form-group">
            <label class="label-principal" for="username">Usuario</label>
            <input type="text" class="form-control" id="username" name="username" value="{{ user.username }}" required>
          </div>

          <div class="form-group">
            <label class="label-principal" for="password">Contraseña (deja en blanco para no cambiar)</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Nueva contraseña (opcional)">
          </div>

          <div class="form-group">
            <label class="label-principal" for="role">Rol</label>
            <select class="form-control" id="role" name="role" required>
              <option value="">Seleccione un rol</option>
              <option value="admin" {{ 'selected' if user.role == 'admin' else '' }}>Administrador General</option>
              <option value="admin_regional" {{ 'selected' if user.role == 'admin_regional' else '' }}>Administrador Regional</option>
              <option value="gestor" {{ 'selected' if user.role == 'gestor' else '' }}>Gestor</option>
              <option value="viewer" {{ 'selected' if user.role == 'viewer' else '' }}>Visualizador</option>
            </select>
          </div>

          <div class="form-group">
            <label class="label-principal" for="oficina_regional">Oficina Regional</label>
            <select class="form-control" id="oficina_regional" name="oficina_regional">
              <option value="">Seleccione una oficina (o dejar vacío para Global)</option>
              {% for of in oficinas %}
                <option value="{{ of }}" {{ 'selected' if user.oficina_regional == of else '' }}>{{ of }}</option>
              {% endfor %}
            </select>
            <small class="form-text text-muted" id="help-oficina">
                Obligatoria para Admin Regional y Gestor. Opcional para Viewer.
            </small>
          </div>

          <div class="d-flex justify-content-end">
            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary mr-2">Cancelar</a>
            <button type="submit" class="btn btn-primary">Guardar cambios</button>
          </div>
        </form>
    </div>

<script>
  const roleSel = document.getElementById('role');
  const orSel   = document.getElementById('oficina_regional');

  function toggleOR() {
    const rol = roleSel.value;

    // Admin: deshabilita y limpia (si quieres forzar limpieza visual)
    if (rol === 'admin') {
        orSel.disabled = true;
        orSel.required = false;
        // Opcional: orSel.value = "";
        // Nota: Al editar, a veces es mejor no borrar el valor visualmente hasta guardar,
        // pero la lógica backend lo pondrá en NULL de todas formas.
    }
    // Admin Regional y Gestor: habilita y obliga
    else if (rol === 'admin_regional' || rol === 'gestor') {
        orSel.disabled = false;
        orSel.required = true;
    }
    // Viewer: habilita pero opcional
    else if (rol === 'viewer') {
        orSel.disabled = false;
        orSel.required = false;
    }
    else {
        orSel.disabled = true;
    }
  }

  // Ejecutar al cargar la página para establecer el estado inicial correcto
  toggleOR();

  // Ejecutar cada vez que cambia el rol
  roleSel.addEventListener('change', toggleOR);
</script>

</body>
</html>
