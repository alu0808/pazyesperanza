<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Crear Usuario</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/styles.css" rel="stylesheet">
  <style>
    .title-bar { background:#343a40;color:#fff;text-align:center;padding:7px;font-size:1rem;width:100%;}
    .title-bar-company{display:flex;justify-content:space-between;align-items:center;background:#1d7c3a;color:#fff;padding:5px 20px;}
    .title-bar-company img{height:40px;}
  </style>
</head>
<body>
  <div class="title-bar-company">
    <a href="{{ url_for('index') }}"><img src="/static/images/logo.png" alt="Logo"></a>
    <div>
      <a href="{{ url_for('logout') }}" class="btn btn-light label-principal">Cerrar sesión</a>
    </div>
  </div>
  <div class="title-bar">CREAR USUARIO</div>

  <div class="container mt-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="alert alert_mod alert-{{ messages[0][0] }}">{{ messages[0][1] }}</div>
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('create_user') }}" class="mb-5">
      <div class="form-group">
        <label class="label-principal" for="username">Usuario</label>
        <input type="text" class="form-control" id="username" name="username" required>
      </div>

      <div class="form-group">
        <label class="label-principal" for="password">Contraseña</label>
        <input type="password" class="form-control" id="password" name="password" required>
      </div>

      <div class="form-group">
        <label class="label-principal" for="role">Rol</label>
        <select class="form-control" id="role" name="role" required>
          <option value="" selected>Seleccione un rol</option>
          <option value="admin">Administrador General (Todo)</option>
          <option value="admin_regional">Administrador Regional (Edita/Inactiva su región)</option>
          <option value="gestor">Gestor (Registra/Edita su región)</option>
          <option value="viewer">Visualizador (Solo lectura)</option>
        </select>
      </div>

      <div class="form-group">
        <label class="label-principal" for="oficina_regional">Oficina Regional</label>
        <select class="form-control" id="oficina_regional" name="oficina_regional" disabled>
          <option value="" selected>Seleccione una oficina (o dejar vacío para Global)</option>
          {% for of in oficinas %}
            <option value="{{ of }}">{{ of }}</option>
          {% endfor %}
        </select>
        <small class="form-text text-muted" id="help-oficina">
          Requerido para Admin Regional y Gestor. Opcional para Viewer (si se deja vacío ve todo).
        </small>
      </div>

      <div class="d-flex justify-content-end">
        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary mr-2">Cancelar</a>
        <button type="submit" class="btn btn-success">Crear</button>
      </div>
    </form>
  </div>

  <script>
    const roleSel = document.getElementById('role');
    const orSel   = document.getElementById('oficina_regional');

    function toggleOR() {
      const rol = roleSel.value;
      // Roles que requieren Oficina Regional OBLIGATORIA o PERMITIDA
      // Admin Regional y Gestor DEBEN tener oficina. Viewer PUEDE tenerla. Admin NO.

      if (rol === 'admin') {
          orSel.disabled = true;
          orSel.value = "";
          orSel.required = false;
      } else if (rol === 'admin_regional' || rol === 'gestor') {
          orSel.disabled = false;
          orSel.required = true;
      } else if (rol === 'viewer') {
          orSel.disabled = false;
          orSel.required = false; // Viewer puede ser global (sin oficina) o regional
      } else {
          orSel.disabled = true;
      }
    }
    roleSel.addEventListener('change', toggleOR);
  </script>
</body>
</html>
